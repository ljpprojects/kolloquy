[package]
name = "kolloquy-phash"
version = "0.1.0"
edition = "2024"

[lib]
name = "kolloquy_phash"
crate-type = ["dylib", "staticlib"]

[[bin]]
name = "kolloquy-phash"

[dependencies]

# Required
kolloquy-consts = { path = "../kolloquy-consts" }
zeroize = { version = "1.9", features = ["simd"] }
argon2 = { version = "0.6", features = ["zeroize", "parallel"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net"] }
axum = { version = "0.8", features = ["http2", "macros"] }
clap = { version = "4.6", features = ["derive"] }
mimalloc = { version = "0.1", features = ["secure"] }
stack-string = "1.2"
password-hash = "0.6.1"
dotenvy = "0.15.7"
base64 = "0.23"
serde_json = "1.0"
keyring-core = "1.0"
secrecy = "0.10"
region = "4.0"
rpassword = "7.5"

# logging feature
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing"], optional = true }
tower-http = { version = "0.7", features = ["trace"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0"

[features]
tracing = ["dep:tracing", "dep:tracing-subscriber"] # Logging (which can be disabled at runtime also, but can be disabled in the binary to reduce size)
default = ["tracing"]