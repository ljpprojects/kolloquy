[package]
name = "kolloquy"
version = "0.1.0"
edition = "2021"
authors = ["ljpprojects <owner@ljpprojects.org>"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[workspace]
resolver = "3"
members = ["kolloquy-state"]

[dependencies.worker]
version = "0.7"
features = ["http", "d1", "axum"]

[dependencies.axum]
version = "0.8"
default-features = false
features = ["json", "macros"]

[dependencies.serde_json]
version = "1.0"
default-features = false

[dependencies.serde]
version = "1.0"
default-features = false
features = ["serde_derive"]

[dependencies.url]
version = "2.5"
default-features = false

[dependencies.base64]
version = "0.22"
default-features = false

[dependencies.web-sys]
version = "0.3"
default-features = false
features = ["Crypto", "Window", "SubtleCrypto", "CryptoKey"]

[dependencies.handlebars]
version = "6.4"
default-features = false
features = ["no_logging"]

[dependencies.chrono]
version = "0.4"
default-features = false

[dependencies.hex]
version = "0.4"
default-features = false

[dependencies]
http = "1.4"
tower-service = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
axum-cookie = "0.2"
const_format = "0.2"
stackvec = "0.2"
stack-string = "1.1.5"
password-hash = { version = "0.6.0-rc.12", features = ["phc"] }
rlsf = "0.2.2"
arrayvec = { version = "0.7.6", features = ["serde"] }
webauthn-rs-proto = "0.5"
base64urlsafedata = "0.5"