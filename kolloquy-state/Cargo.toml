[package]
name = "kolloquy-state"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde_json = "1.0"
stack-string = "1.1"

[dependencies.worker]
version = "0.8"
features = ["d1"]

[dependencies.web-sys]
version = "0.3"
default-features = false
features = ["Crypto", "Window", "SubtleCrypto", "CryptoKey"]

[dependencies.serde]
version = "1.0"
features = ["derive"]
