[package]
name = "kolloquy-crypto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
openssl = "0.10"
rustls = "0.23"
kolloquy-consts = { path = "../kolloquy-consts" }
kolloquy-phash = { path = "../kolloquy-phash" }
stack-string = "1.2"
phc = "0.6.1"

[dependencies.tokio]
version = "1.54"
features = ["net", "fs"]
optional = true

[dependencies.reqwest]
version = "0.13"
features = ["rustls"]
optional = true

[dependencies.argon2]
version = "0.6"
optional = true
features = ["zeroize", "parallel"]

[features]
default = ["no-phash-serv"]
no-phash-serv = ["dep:argon2"]
use-phash-serv = ["dep:tokio", "dep:reqwest"]
